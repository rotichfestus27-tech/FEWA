<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Course Details | FEWA Beauty &amp; Fashion College</title>
    <meta name="description" content="Explore professional cosmetology and fashion design programmes at FEWA Beauty & Fashion College in Nairobi, Kenya.">
    <link rel="canonical" href="https://fewa.ac.ke/courses">
    <link rel="icon" type="image/png" href="/assets/logo.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="FEWA Beauty & Fashion College">
    <meta property="og:title" content="Course Details | FEWA Beauty & Fashion College">
    <meta property="og:description" content="Explore professional cosmetology and fashion design programmes at FEWA Beauty & Fashion College in Nairobi, Kenya.">
    <meta property="og:url" content="https://fewa.ac.ke/courses">
    <meta property="og:image" content="https://fewa.ac.ke/assets/logo.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Course Details | FEWA Beauty & Fashion College">
    <meta name="twitter:description" content="Explore professional cosmetology and fashion design programmes at FEWA Beauty & Fashion College in Nairobi, Kenya.">
    <meta name="twitter:image" content="https://fewa.ac.ke/assets/logo.png">
    <link rel="stylesheet" href="/style.css?v=20261010-feesfix">
    <link rel="stylesheet" href="/assets/fontawesome/fa-subset.css">
</head>

<body class="courses-page course-detail-page">
    <header class="main-header">
        <div class="header-inner">
            <a href="/index.html" class="logo-link"><picture><source srcset="/assets/logo.webp" type="image/webp"><img src="/assets/logo.png" alt="FEWA Beauty and Fashion College"
                    class="logo-img"></picture><span class="logo-brand-text"><span class="brand-name">FEWA</span><span
                        class="brand-tagline">BEAUTY &amp; FASHION COLLEGE</span></span></a>
            <button class="menu-toggle" id="mobile-menu" aria-label="Open navigation" aria-expanded="false"
                type="button"><span class="bar"></span><span class="bar"></span><span class="bar"></span></button>
            <nav class="nav-links" aria-label="Main navigation"><a href="/index.html" class="nav-item">Home</a><a
                    href="/about.html" class="nav-item">About Us</a><a href="/courses.html"
                    class="nav-item active">Courses</a><a href="/admissions.html" class="nav-item">Admission</a><a
                    href="/fees.html" class="nav-item">Fees</a><a
                    href="/portal.html" class="nav-item">Student Portal</a><a href="/contact.html"
                    class="nav-item">Contact Us</a><a href="/apply" class="nav-item nav-item-cta">Enroll Now <i class="fas fa-arrow-right" aria-hidden="true"></i></a></nav>
            <div class="header-cta"><a href="/apply.html" class="header-cta-btn">Enroll Now <i class="fas fa-arrow-right"
                        aria-hidden="true"></i></a></div>
        </div>
    </header>
    <main id="course-detail" class="course-detail-content"></main>
    <script src="/scripts/course-catalog-data.js"></script>
    <script src="/scripts/courses.js"></script>
    <script>
        const pathSlug = window.location.pathname.split('/').filter(Boolean).pop();
        const slug = pathSlug && pathSlug !== 'course-detail.html' ? pathSlug : new URLSearchParams(window.location.search).get('course');
        const course = window.FEWA_COURSES.find((item) => item.slug === slug);
        const detail = document.querySelector('#course-detail');

        const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c]));

        // Replaces the former fee-table section. about.overview holds the
        // official programme description(s) supplied by FEWA (see
        // course-catalog-data.js) -- isDraft is only true for a course whose
        // description has not yet been supplied/approved by FEWA.
        function renderAboutSection(about) {
            if (!about) {
                return `<section class="fees-section" aria-labelledby="course-about-heading">
                    <h2 id="course-about-heading">About the Course</h2>
                    <p class="fees-contact-note">Contact FEWA Admissions for full details on this programme.</p>
                </section>`;
            }
            const paragraphs = Array.isArray(about.overview) ? about.overview : [about.overview];
            const overviewHtml = paragraphs.filter(Boolean).map((p) => `<p>${escapeHtml(p)}</p>`).join('');
            return `<section class="fees-section course-about-section" aria-labelledby="course-about-heading">
                <h2 id="course-about-heading">About the Course</h2>
                ${about.isDraft ? '<p class="course-about-draft-note"><i class="fas fa-circle-info" aria-hidden="true"></i> Draft content -- pending final review by FEWA.</p>' : ''}
                <div class="course-about-block">${overviewHtml}</div>
            </section>`;
        }

        function setMetaTag(selector, attribute, value) {
            const el = document.querySelector(selector);
            if (el) el.setAttribute(attribute, value);
        }

        function addJsonLd(data) {
            const script = document.createElement('script');
            script.type = 'application/ld+json';
            script.textContent = JSON.stringify(data);
            document.head.appendChild(script);
        }

        if (course) {
            document.title = `${course.title} | FEWA Beauty & Fashion College`;
            const courseUrl = `https://fewa.ac.ke/courses/${course.slug}`;
            const courseOgTitle = `${course.title} | FEWA Beauty & Fashion College`;

            setMetaTag('meta[name="description"]', 'content', course.description);
            setMetaTag('link[rel="canonical"]', 'href', courseUrl);
            setMetaTag('meta[property="og:title"]', 'content', courseOgTitle);
            setMetaTag('meta[property="og:description"]', 'content', course.description);
            setMetaTag('meta[property="og:url"]', 'content', courseUrl);
            // og:image/twitter:image intentionally left at their static default
            // (the FEWA logo, set in <head>) -- course.image is a placeholder
            // AI image, not a real photo, so it should not appear in link
            // previews either until official photography is supplied.
            setMetaTag('meta[name="twitter:title"]', 'content', courseOgTitle);
            setMetaTag('meta[name="twitter:description"]', 'content', course.description);

            addJsonLd({
                '@context': 'https://schema.org',
                '@type': 'Course',
                name: course.title,
                description: course.description,
                url: courseUrl,
                provider: {
                    '@type': 'EducationalOrganization',
                    name: 'FEWA Beauty & Fashion College',
                    url: 'https://fewa.ac.ke/'
                }
            });
            const aboutSection = renderAboutSection(course.about);
            const heroImageMarkup = window.FEWA_coursePlaceholderMarkup(course);
            const metaParts = window.FEWA_courseMetaBadges(course)
                .map((b) => `<span><i class="fas ${b.icon}"></i>${escapeHtml(b.text)}</span>`)
                .join('');
            const courseMetaMarkup = metaParts ? `<div class="course-meta">${metaParts}</div>` : '';
            detail.innerHTML = `<section class="detail-hero"><div class="detail-hero-image">${heroImageMarkup}</div><div class="detail-hero-copy"><span class="courses-eyebrow">${escapeHtml(course.category)}</span><h1>${escapeHtml(course.title)}</h1><p>${escapeHtml(course.description)}</p>${courseMetaMarkup}</div></section>
                ${aboutSection}
                <section class="course-cta" aria-label="Apply for this programme">
                    <div><span class="cta-kicker">Ready to apply?</span><h2>${escapeHtml(course.title)}</h2><p>Start your FEWA application for this programme.</p></div>
                    <a class="cta-button" href="/apply.html?programme=${encodeURIComponent(course.slug)}">Apply Now <span aria-hidden="true">&rarr;</span></a>
                </section>`;
        } else {
            detail.innerHTML = '<section class="courses-intro"><span class="courses-eyebrow">Programme not found</span><h1>Explore our courses</h1><a class="cta-button" href="/courses.html">Back to Courses <span aria-hidden="true">&rarr;</span></a></section>';
        }
    </script>
</body>

</html>
